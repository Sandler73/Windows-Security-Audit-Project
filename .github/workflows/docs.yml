# ============================================================================
# Documentation Accuracy
# ----------------------------------------------------------------------------
# Documentation in this project has repeatedly drifted from the codebase:
# version metadata four releases stale, a badge advertising a check count that
# an audit had already discredited, an architecture diagram whose component
# inventory listed two of eleven components, and references to functions that
# do not exist. Every one of those was found by hand, after shipping.
#
# This workflow makes documentation accuracy a build gate instead. It runs the
# repository's own audit tool, which derives ground truth from the source tree
# and fails when the documentation disagrees with it.
# ============================================================================

name: Documentation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accuracy:
    name: Documentation accuracy audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run documentation audit
        run: |
          python3 tools/docs-audit.py --fail-on HIGH --json docs-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-audit-report
          path: docs-audit.json
          if-no-files-found: ignore
          retention-days: 30

  mermaid:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate diagram structure and references
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path(".")
          issues = 0

          # Every function named in a diagram must exist in the codebase. A
          # diagram once referenced a tooling function that was never part of
          # the product, and it read as authoritative.
          allps = "\n".join(
              p.read_text(encoding="utf-8")
              for p in list(root.glob("*.ps1"))
                     + list((root / "shared_components").glob("*.ps1"))
                     + list((root / "modules").glob("*.ps1"))
          )
          real = set(re.findall(r"^function\s+([A-Za-z][\w-]*)", allps, re.M))
          builtin = {
              'Get-Service','Get-ChildItem','Write-Host','Export-Csv','ConvertTo-Json',
              'Get-CimInstance','Get-ItemProperty','Set-ItemProperty','New-Item',
              'Get-Content','Out-File','Test-Path','Where-Object','Select-Object',
              'Add-Content','Format-Table','Get-Date','Sort-Object','Group-Object',
              'Get-HotFix','Get-LocalUser','Get-NetIPConfiguration','Get-LocalGroupMember',
              'Get-NetTCPConnection','Get-NetFirewallProfile','Get-MpComputerStatus',
              'Get-MpPreference','Get-WinEvent','Get-Command','Get-Module','Import-Module',
              'Remove-Item','Copy-Item','New-Object','Compare-Object','ForEach-Object',
              'Write-Output','Write-Warning','Write-Error','Start-Service','Stop-Service',
              'Set-Service','Get-SmbServerConfiguration','Get-WindowsOptionalFeature',
              'Get-BitLockerVolume','Enable-BitLocker','Measure-Object','Invoke-Pester',
          }
          verbs = {'Get','Set','New','Export','Import','Invoke','Test','Show','Start',
                   'Stop','Build','Convert','ConvertTo','Add','Remove','Compare','Find',
                   'Initialize','Repair','Resolve','Update','Enable','Disable','Write'}

          for doc in root.rglob("*.md"):
              if ".git" in str(doc):
                  continue
              text = doc.read_text(encoding="utf-8")
              for i, block in enumerate(re.findall(r"```mermaid\n(.*?)```", text, re.S), 1):
                  lines = [l for l in block.split("\n") if l.strip()]
                  if not lines:
                      continue
                  kind = lines[0].strip()

                  if kind.startswith(("graph", "flowchart")):
                      opens = sum(1 for l in lines if l.strip().startswith("subgraph"))
                      closes = sum(1 for l in lines if l.strip() == "end")
                      if opens != closes:
                          print(f"::error file={doc}::diagram {i}: subgraph/end mismatch {opens}/{closes}")
                          issues += 1

                      nodes = set(re.findall(r"^\s*([A-Za-z][A-Za-z0-9_]*)[\[\(\{]", block, re.M))
                      edged = set()
                      for l in lines:
                          if any(a in l for a in ("-->", "-.->", "==>", "---")):
                              edged |= set(re.findall(r"\b([A-Za-z][A-Za-z0-9_]*)\b", l))
                      orphans = sorted(n for n in nodes - edged if n not in ("subgraph", "end", "style"))
                      if orphans:
                          print(f"::error file={doc}::diagram {i}: orphaned nodes {orphans}")
                          issues += 1

                  if block.count("[") != block.count("]"):
                      print(f"::error file={doc}::diagram {i}: bracket imbalance")
                      issues += 1
                  if block.count('"') % 2:
                      print(f"::error file={doc}::diagram {i}: unbalanced quotes")
                      issues += 1

                  referenced = {
                      f for f in re.findall(r"\b([A-Z][a-z]+-[A-Z][A-Za-z0-9]*)\b", block)
                      if f.split("-")[0] in verbs
                  }
                  for f in sorted(referenced - real - builtin):
                      print(f"::error file={doc}::diagram {i}: references non-existent function {f}")
                      issues += 1

          print(f"\nDiagram issues: {issues}")
          sys.exit(1 if issues else 0)
          PY

  links:
    name: Relative link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify relative links resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys, urllib.parse
          root = pathlib.Path(".")
          broken = 0
          for doc in root.rglob("*.md"):
              # tasks/ holds working state, not published documentation.
              if ".git" in str(doc) or "tasks/" in str(doc):
                  continue
              text = doc.read_text(encoding="utf-8")
              # Strip fenced and inline code so PowerShell snippets are not
              # parsed as markdown links.
              text = re.sub(r"```.*?```", "", text, flags=re.S)
              text = re.sub(r"`[^`]*`", "", text)
              for m in re.finditer(r"\]\((?!https?://|mailto:|#)([^)#]+?)(?:#[^)]*)?\)", text):
                  target = urllib.parse.unquote(m.group(1).strip())
                  if not target or target.startswith("$"):
                      continue
                  # GitHub wiki pages are linked by page name, without an
                  # extension, and resolve inside the wiki itself.
                  if "/wiki/" in str(doc) and "/" not in target and not target.endswith(".md"):
                      continue
                  path = doc.parent / target
                  if not path.exists() and not (doc.parent / (target + ".md")).exists():
                      print(f"::error file={doc}::broken relative link -> {target}")
                      broken += 1
          print(f"\nBroken relative links: {broken}")
          sys.exit(1 if broken else 0)
          PY
