# ============================================================================
# Integration Tests Workflow
# ----------------------------------------------------------------------------
# Runs end-to-end audit executions across all currently-supported Windows
# versions to verify the orchestrator + modules + shared library work
# correctly as an integrated system.
#
# This is the slower of the two test workflows. Tests:
#   - Single-module standalone execution
#   - Full 16-module orchestrator execution
#   - All output formats (HTML, JSON, CSV, XML)
#   - Parallel vs sequential execution equivalence
#   - Cache vs no-cache behavior
#   - Auto-logging behavior
#   - Help system invocation forms
# ============================================================================

name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_self_hosted:
        description: 'Include self-hosted runners (requires registered runners)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 6am UTC

# Cancel in-progress runs when a new push lands on the same branch / PR.
# Prevents queue pile-up under the GitHub Free plan's 20-concurrent-job cap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # GitHub-hosted Windows Server runners
  # --------------------------------------------------------------------------
  e2e-hosted:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "OS: ${{ matrix.os }}"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Caption: $($os.Caption)"
          Write-Host "Build:   $($os.BuildNumber)"
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"

      - name: Verify orchestrator help system
        shell: pwsh
        run: |
          # Capture all streams (1=stdout, 2=stderr, 3=warning, 4=verbose,
          # 5=debug, 6=information). Show-DetailedHelp uses Write-Host, which
          # emits to stream 6 -- a `2>&1` redirect would miss it.
          $output = & .\Windows-Security-Audit.ps1 -Help *>&1 | Out-String

          Write-Host "----- Captured help output (first 800 chars) -----"
          $preview = if ($output.Length -gt 800) { $output.Substring(0, 800) + '...' } else { $output }
          Write-Host $preview
          Write-Host "----- End preview (total length: $($output.Length) chars) -----"

          if ($output -notmatch 'Windows Security Audit') {
            throw "Help output missing expected content (no 'Windows Security Audit' string found in $($output.Length) chars of output)"
          }
          Write-Host "Help system: OK"

      - name: Verify module discovery
        shell: pwsh
        run: |
          $output = & .\Windows-Security-Audit.ps1 -ListModules *>&1 | Out-String

          Write-Host "----- Captured -ListModules output -----"
          Write-Host $output
          Write-Host "----- End output -----"

          $expected = @('acsc','cis','cisa','cmmc','core','enisa','gdpr','hipaa',
                        'iso27001','ms','ms-defenderatp','nist','nsa','pcidss','soc2','stig')
          $missing = @()
          foreach ($mod in $expected) {
            if ($output -notmatch $mod) { $missing += $mod }
          }
          if ($missing.Count -gt 0) {
            throw "Modules missing from -ListModules output: $($missing -join ', ')"
          }
          Write-Host "All 16 modules discoverable"

      - name: Run single-module audit (core)
        shell: pwsh
        run: |
          # The orchestrator constructs filenames as
          # Windows-Security-Audit-{ComputerName}-{yyyy-MM-dd_HHmmss}.{ext}
          # and treats -OutputPath as a directory hint (uses parent of any
          # path passed). Each test step uses its own subdirectory so we can
          # find the generated file unambiguously via wildcard.
          New-Item -Path .\test-output\core -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules core `
            -OutputFormat JSON `
            -OutputPath .\test-output\core\out `
            -Quiet
          $jsonFiles = @(Get-ChildItem -Path .\test-output\core -Recurse `
                          -Filter 'Windows-Security-Audit-*.json')
          if ($jsonFiles.Count -eq 0) {
            Write-Host "Directory contents:"
            Get-ChildItem .\test-output\core -Recurse | Format-Table -AutoSize
            throw "No JSON output generated under .\test-output\core\"
          }
          # Reports are written to <OutputPath>\<hostname>\ by design, so the
          # file must sit inside a directory named for the audited host.
          if ($jsonFiles[0].Directory.Name -ne $env:COMPUTERNAME) {
            throw "Expected output under a '$env:COMPUTERNAME' directory, found '$($jsonFiles[0].Directory.Name)'"
          }
          Write-Host "  [OK]   output landed in $($jsonFiles[0].Directory.FullName)"
          $jsonPath = $jsonFiles[0].FullName
          Write-Host "Generated: $jsonPath"
          $data = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $count = @($data.Results).Count
          Write-Host "core module emitted $count results"
          if ($count -lt 50) {
            throw "core module emitted only $count results (expected >=50)"
          }

      - name: Run multi-module sequential audit
        shell: pwsh
        run: |
          New-Item -Path .\test-output\multi-seq -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules core,cis,stig `
            -OutputFormat JSON `
            -OutputPath .\test-output\multi-seq\out `
            -Quiet
          $jsonFiles = @(Get-ChildItem -Path .\test-output\multi-seq -Recurse `
                          -Filter 'Windows-Security-Audit-*.json')
          if ($jsonFiles.Count -eq 0) {
            throw "No JSON output generated in .\test-output\multi-seq\"
          }
          $data = Get-Content $jsonFiles[0].FullName -Raw | ConvertFrom-Json
          $count = @($data.Results).Count
          Write-Host "Sequential 3-module audit: $count results"
          if ($count -lt 150) {
            throw "Multi-module audit emitted only $count results (expected >=150)"
          }

      - name: Run multi-module parallel audit
        shell: pwsh
        run: |
          New-Item -Path .\test-output\multi-par -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules core,cis,stig `
            -OutputFormat JSON `
            -OutputPath .\test-output\multi-par\out `
            -Parallel -Workers 2 `
            -Quiet
          $parJsonFiles = @(Get-ChildItem -Path .\test-output\multi-par -Recurse `
                              -Filter 'Windows-Security-Audit-*.json')
          if ($parJsonFiles.Count -eq 0) {
            throw "No JSON output generated in .\test-output\multi-par\"
          }
          $data = Get-Content $parJsonFiles[0].FullName -Raw | ConvertFrom-Json
          $count = @($data.Results).Count
          Write-Host "Parallel 3-module audit: $count results"

          # Compare to sequential within 5%
          $seqJsonFiles = @(Get-ChildItem -Path .\test-output\multi-seq -Recurse `
                              -Filter 'Windows-Security-Audit-*.json')
          $seqData = Get-Content $seqJsonFiles[0].FullName -Raw | ConvertFrom-Json
          $seqCount = @($seqData.Results).Count
          $delta = [math]::Abs($count - $seqCount)
          $tolerance = $seqCount * 0.05
          if ($delta -gt $tolerance) {
            Write-Warning "Sequential and parallel results differ by $delta (>5%)"
          } else {
            Write-Host "Sequential and parallel within tolerance"
          }

      - name: Run all-format multi-output audit
        shell: pwsh
        run: |
          New-Item -Path .\test-output\all-format -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules core `
            -OutputFormat All `
            -OutputPath .\test-output\all-format\out `
            -Quiet
          @('html','json','csv','xml') | ForEach-Object {
            $files = @(Get-ChildItem -Path .\test-output\all-format -Recurse `
                          -Filter "Windows-Security-Audit-*.$_")
            if ($files.Count -eq 0) {
              Write-Host "Directory contents:"
              Get-ChildItem .\test-output\all-format | Format-Table -AutoSize
              throw "Expected $_ output file missing in .\test-output\all-format\"
            }
            Write-Host "  Generated: $($files[0].Name) ($($files[0].Length) bytes)"
          }

      - name: Run full 16-module audit (parallel)
        shell: pwsh
        run: |
          New-Item -Path .\test-output\full -ItemType Directory -Force | Out-Null
          $start = Get-Date
          .\Windows-Security-Audit.ps1 `
            -Modules All `
            -OutputFormat JSON `
            -OutputPath .\test-output\full\out `
            -Parallel -Workers 4 `
            -Quiet
          $duration = (Get-Date) - $start

          $jsonFiles = @(Get-ChildItem -Path .\test-output\full -Recurse `
                          -Filter 'Windows-Security-Audit-*.json')
          if ($jsonFiles.Count -eq 0) {
            throw "No JSON output generated in .\test-output\full\"
          }
          $jsonPath = $jsonFiles[0].FullName
          $data = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $count = @($data.Results).Count
          $modules = @($data.Results.Module | Sort-Object -Unique)

          Write-Host ""
          Write-Host "Full audit duration: $($duration.TotalSeconds.ToString('F2'))s"
          Write-Host "Total results:       $count"
          Write-Host "Unique modules:      $($modules.Count)"
          Write-Host "Module list:         $($modules -join ', ')"

          if ($count -lt 1500) {
            throw "Full audit emitted only $count results (expected >=1500)"
          }
          if ($modules.Count -lt 14) {
            throw "Only $($modules.Count) modules contributed results (expected >=14)"
          }

          # Persist path for next step's schema validation
          $jsonPath | Out-File -FilePath .\test-output\full\jsonpath.txt -Encoding ASCII

      - name: Verify auto-logging (no -LogFile specified)
        shell: pwsh
        run: |
          New-Item -Path .\test-output\autolog -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules core `
            -OutputFormat JSON `
            -OutputPath .\test-output\autolog\out `
            -Quiet
          $logFiles = Get-ChildItem -Path .\logs -Filter 'audit-*.log' -ErrorAction SilentlyContinue
          if ($logFiles.Count -eq 0) {
            throw "Auto-logging did not create a log file in .\logs\"
          }
          Write-Host "Auto-created log: $($logFiles[0].Name)"

      - name: Validate JSON schema across all formats
        shell: pwsh
        run: |
          # Read the path captured by the previous full-audit step
          $jsonPath = (Get-Content .\test-output\full\jsonpath.txt -Raw).Trim()
          if (-not (Test-Path $jsonPath)) {
            throw "Full-audit JSON not found at: $jsonPath"
          }
          $data = Get-Content $jsonPath -Raw | ConvertFrom-Json

          # Validate against the actual JSON contract emitted by Export-JsonReport
          # (Windows-Security-Audit.ps1 ~ line 1610). The orchestrator deliberately
          # uses snake_case / lowercase keys in JSON output (matching JSON style
          # conventions), distinct from the PascalCase used in PowerShell objects
          # internally and in XML output.
          #
          # Required JSON-output schema (per Export-JsonReport in orchestrator):
          $required = @('module','category','status','severity','message',
                        'details','remediation','cross_references','timestamp')
          $validStatus = @('Pass','Fail','Warning','Info','Error')
          $validSeverity = @('Critical','High','Medium','Low','Informational')

          # Top-level structure
          $topLevel = $data.PSObject.Properties.Name
          foreach ($key in @('metadata','summary','results')) {
            if ($topLevel -notcontains $key) {
              throw "Top-level JSON key missing: '$key' (found: $($topLevel -join ', '))"
            }
          }

          # Per-result schema
          $schemaErrors = New-Object System.Collections.Generic.List[string]
          $resultIndex = 0
          foreach ($r in $data.results) {
            $names = $r.PSObject.Properties.Name
            foreach ($f in $required) {
              if ($names -notcontains $f) {
                $schemaErrors.Add("Result[$resultIndex] missing field '$f'")
              }
            }
            if ($validStatus -notcontains $r.status) {
              $schemaErrors.Add("Result[$resultIndex] has invalid status='$($r.status)'")
            }
            if ($validSeverity -notcontains $r.severity) {
              $schemaErrors.Add("Result[$resultIndex] has invalid severity='$($r.severity)'")
            }
            $resultIndex++
          }

          if ($schemaErrors.Count -gt 0) {
            Write-Host "First 10 schema errors:"
            $schemaErrors | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Sample of first result object (for diagnosis):"
            $data.results[0] | ConvertTo-Json -Depth 3 | Write-Host
            throw "Schema validation found $($schemaErrors.Count) errors across $resultIndex results"
          }
          Write-Host "Schema validation: all $resultIndex results conform to JSON schema"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-output-${{ matrix.os }}
          path: |
            test-output/**/*
            logs/**/*
          retention-days: 14

  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Self-hosted Windows client / older Server runners
  # --------------------------------------------------------------------------
  # See unit-tests.yml header for runner-label conventions.
  # GATING: Only runs when explicitly requested via workflow_dispatch input
  # OR on the weekly schedule. Without a gate, these matrix jobs queue
  # forever waiting for runners that may not exist on a given installation.
  # --------------------------------------------------------------------------
  e2e-self-hosted:
    name: E2E (${{ matrix.runner.os }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_self_hosted == true)
    runs-on:
      - self-hosted
      - ${{ matrix.runner.label }}
    timeout-minutes: 60
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        runner:
          - { label: server-2016,        os: 'Windows Server 2016' }
          - { label: win11-21h2,         os: 'Windows 11 21H2' }
          - { label: win11-22h2,         os: 'Windows 11 22H2' }
          - { label: win11-23h2,         os: 'Windows 11 23H2' }
          - { label: win11-24h2,         os: 'Windows 11 24H2' }
          - { label: win10-21h2,         os: 'Windows 10 21H2' }
          - { label: win10-22h2,         os: 'Windows 10 22H2' }
          - { label: win10-iotltsc-2021, os: 'Windows 10 IoT LTSC 2021' }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Expected: ${{ matrix.runner.os }}"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Actual:   $($os.Caption) (build $($os.BuildNumber))"

      - name: Run audit (parallel, all 16 modules)
        shell: pwsh
        run: |
          $outDir = ".\test-output\${{ matrix.runner.label }}"
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          .\Windows-Security-Audit.ps1 `
            -Modules All `
            -OutputFormat All `
            -OutputPath "$outDir\out" `
            -Parallel -Workers 4 `
            -Quiet
          $jsonFiles = @(Get-ChildItem -Path $outDir -Filter 'Windows-Security-Audit-*.json')
          if ($jsonFiles.Count -eq 0) {
            Write-Host "Directory contents:"
            Get-ChildItem $outDir | Format-Table -AutoSize
            throw "JSON output not generated in $outDir"
          }
          Write-Host "Generated: $($jsonFiles[0].Name)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ matrix.runner.label }}
          path: |
            test-output/**/*
            logs/**/*
          retention-days: 14

  # ==========================================================================
  # Component surface
  # --------------------------------------------------------------------------
  # Every shared component is loaded and its public entry points exercised.
  # Added because CI previously referenced none of the components introduced
  # from v6.3 onward: a component could have been broken for several releases
  # without any workflow noticing.
  # ==========================================================================
  component-surface:
    name: Shared component surface
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load every component and exercise its entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = 0

          $components = Get-ChildItem .\shared_components -Filter '*.ps1' | Sort-Object Name
          Write-Host "Discovered $($components.Count) shared component(s)"

          foreach ($c in $components) {
            try {
              . $c.FullName
              Write-Host "  [OK]   loaded $($c.Name)"
            } catch {
              Write-Host "::error file=$($c.FullName)::failed to load: $($_.Exception.Message)"
              $failed++
            }
          }

          # Public entry points, asserted by name so a rename cannot silently
          # break a documented API.
          $entryPoints = @{
            'Get-AuditProfile'            = 'profiles'
            'Get-SharedAssessment'        = 'shared-assessments'
            'Get-RemediationTopic'        = 'canonical-remediations'
            'New-RemediationPlan'       = 'remediation-library'
            'Get-BundlePlan'              = 'remediation-bundles'
            'New-RollbackScript'          = 'rollback-generator'
            'New-AttackSurface'         = 'attack-surface'
            'Export-AttackSurfaceReport'  = 'attack-surface'
            'Export-FrameworkReports'     = 'report-templates'
            'Invoke-AuditPipeline'        = 'audit-pipeline'
            'Get-PipelineSummary'         = 'audit-pipeline'
          }
          foreach ($fn in $entryPoints.Keys | Sort-Object) {
            if (Get-Command $fn -ErrorAction SilentlyContinue) {
              Write-Host "  [OK]   $fn ($($entryPoints[$fn]))"
            } else {
              Write-Host "::error::missing public entry point $fn from $($entryPoints[$fn])"
              $failed++
            }
          }

          # Behavioural invariants that the documentation asserts.
          $checks = @(
            @{ N = 'canonical topics have library entries 1:1'
               C = { (Get-CanonicalTopics).Count -eq (Get-RemediationEntries).Keys.Count } }
            @{ N = 'every canonical topic is bundled'
               C = { $b = @(Get-RemediationBundleNames | ForEach-Object { (Get-RemediationBundle -Name $_).Topics }) | Select-Object -Unique
                     @(Get-CanonicalTopics | Where-Object { $b -notcontains $_ }).Count -eq 0 } }
            @{ N = 'unknown impact maps to the most cautious tier'
               C = { (Get-ConfirmationTier -Impact 'SomethingNew') -eq 3 } }
            @{ N = 'profile module references all resolve'
               C = { $disk = Get-ChildItem .\modules -Filter 'module-*.ps1' | ForEach-Object { $_.BaseName -replace '^module-','' }
                     $map  = @{ 'ms-defenderatp'='MS-DefenderATP'; 'pcidss'='PCI-DSS' }
                     $bad = 0
                     foreach ($p in Get-AuditProfileNames) {
                       foreach ($m in (Get-AuditProfile -Name $p).Modules) {
                         $hit = $disk | Where-Object { $c = if ($map.ContainsKey($_)) { $map[$_] } else { $_ }; $c -ieq $m }
                         if (-not $hit) { $bad++ }
                       }
                     }
                     $bad -eq 0 } }
            @{ N = 'attack-surface domain priority is a valid permutation'
               C = { ($script:AS_DomainPriority | Sort-Object) -join ',' -eq (0..($script:AS_Domains.Count-1) -join ',') } }
          )
          Write-Host ""
          Write-Host "Behavioural invariants:"
          foreach ($chk in $checks) {
            try {
              if (& $chk.C) { Write-Host "  [OK]   $($chk.N)" }
              else { Write-Host "::error::invariant failed: $($chk.N)"; $failed++ }
            } catch {
              Write-Host "::error::invariant errored: $($chk.N) -- $($_.Exception.Message)"; $failed++
            }
          }

          Write-Host ""
          if ($failed -gt 0) { throw "$failed component-surface failure(s)" }
          Write-Host "Component surface: OK"

  # ==========================================================================
  # Parameter surface
  # --------------------------------------------------------------------------
  # Exercises the operator-facing parameters added since v6.3, none of which
  # were previously invoked anywhere in CI.
  # ==========================================================================
  parameter-surface:
    name: Parameter surface
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Catalogue switches exit cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A switch name held in a variable is passed POSITIONALLY, so it binds
          # to -Modules (the first positional parameter) and is rejected by its
          # ValidateSet. Splat a hashtable so the switch binds by name.
          foreach ($sw in 'ListModules', 'ListProfiles', 'ListBundles') {
            $splat = @{ $sw = $true }
            # Write-Host writes to the Information stream (6), so 2>&1 does not
            # capture catalogue output. Redirect all streams.
            $out = & .\Windows-Security-Audit.ps1 @splat *>&1 | Out-String
            if ([string]::IsNullOrWhiteSpace($out)) { throw "-$sw produced no output" }
            Write-Host "  [OK]   -$sw ($($out.Length) chars)"
          }

      - name: Documented help forms are accepted
        shell: pwsh
        run: |
          # Only the prefixed forms work: -Modules is the first positional
          # parameter and carries a ValidateSet, so a bare token binds to it
          # and is rejected during parameter binding.
          foreach ($form in 'Help', 'H', 'help', 'h', 'ShowHelp') {
            try {
              $splat = @{ $form = $true }
              $out = & .\Windows-Security-Audit.ps1 @splat *>&1 | Out-String
              if ($out -notmatch 'Windows Security Audit') { throw "no help content" }
              Write-Host "  [OK]   -$form"
            } catch {
              Write-Host "::error::documented help form -$form failed: $($_.Exception.Message)"
              throw
            }
          }

      - name: Parameter validation is enforced
        shell: pwsh
        run: |
          $rejected = 0
          foreach ($case in @(
            @{ A = @('-AssetCriticality', '11');   N = 'AssetCriticality above range' }
            @{ A = @('-AssetCriticality', '0');    N = 'AssetCriticality below range' }
            @{ A = @('-ComplianceThreshold','101');N = 'ComplianceThreshold above range' }
            @{ A = @('-OutputFormat','Bogus');     N = 'OutputFormat outside ValidateSet' }
            @{ A = @('-Profile','NotAProfile');    N = 'Profile outside ValidateSet' }
          )) {
            try {
              & .\Windows-Security-Audit.ps1 @($case.A) -ListModules 2>&1 | Out-Null
              Write-Host "::error::$($case.N) was ACCEPTED but should be rejected"
              $script:notRejected = $true
            } catch {
              Write-Host "  [OK]   $($case.N) rejected"
              $rejected++
            }
          }
          if ($rejected -lt 5) { throw "parameter validation is not being enforced" }

      - name: Report outputs land in the documented layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & .\Windows-Security-Audit.ps1 -Modules Core -OutputFormat HTML `
              -SplitReports -AttackSurfaceReport -ComplianceThreshold 60 `
              -AssetCriticality 8 2>&1 | Out-Null

          $hostDir = Join-Path 'reports' $env:COMPUTERNAME
          if (-not (Test-Path $hostDir)) { throw "expected host directory $hostDir was not created" }
          Write-Host "  [OK]   reports\<hostname>\ created"

          $composite = Get-ChildItem $hostDir -Filter "Windows-Security-Audit-*$env:COMPUTERNAME*.html" -ErrorAction SilentlyContinue
          if (-not $composite) { $composite = Get-ChildItem $hostDir -Filter 'Windows-Security-Audit-*.html' }
          if (-not $composite) { throw "composite report not found in $hostDir" }
          Write-Host "  [OK]   composite: $($composite[0].Name)"

          $attack = Get-ChildItem $hostDir -Filter 'Attack-Surface-Report-*.html' -ErrorAction SilentlyContinue
          if (-not $attack) { throw "attack-surface report not found (documented for -AttackSurfaceReport)" }
          if ($attack[0].Name -notmatch [regex]::Escape($env:COMPUTERNAME)) {
            throw "attack-surface filename does not carry the hostname: $($attack[0].Name)"
          }
          Write-Host "  [OK]   attack surface: $($attack[0].Name)"

          $byFramework = Join-Path $hostDir 'by-framework'
          if (-not (Test-Path $byFramework)) { throw "by-framework directory not created for -SplitReports" }
          $split = Get-ChildItem $byFramework -Filter '*-Report-*.html'
          if (-not $split) { throw "no per-framework reports produced" }
          if ($split[0].Name -notmatch [regex]::Escape($env:COMPUTERNAME)) {
            throw "split report filename does not carry the hostname: $($split[0].Name)"
          }
          Write-Host "  [OK]   split reports: $($split.Count) file(s), e.g. $($split[0].Name)"

      - name: HostFacts registry and -SplitOnly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\shared_components\host-facts.ps1
          if (-not (Get-Command New-HostFactsRegistry -ErrorAction SilentlyContinue)) {
            throw 'host-facts.ps1 did not expose New-HostFactsRegistry'
          }
          $facts = New-HostFactsRegistry
          if (-not $facts -or $facts.Keys.Count -lt 20) {
            throw "HostFacts registry returned $($facts.Keys.Count) fact(s); expected the full set"
          }
          Write-Host "  [OK]   HostFacts registry: $($facts.Keys.Count) facts"

          # RawOSCim is always attempted, so its absence is a real defect.
          # The Defender and firewall raw objects are only retained when those
          # subsystems answer, which is host-dependent (a runner without
          # Defender legitimately has neither), so they are reported rather
          # than asserted.
          if (-not $facts.ContainsKey('RawOSCim')) {
            throw 'HostFacts is missing RawOSCim; modules rely on it to avoid re-querying per module'
          }
          Write-Host "  [OK]   RawOSCim retained for module reuse"
          foreach ($raw in 'RawDefenderStatus','RawFirewallProfiles') {
            $state = if ($facts.ContainsKey($raw)) { 'retained' } else { 'absent (subsystem unavailable on this host)' }
            Write-Host "  [info] $raw : $state"
          }

          # -SplitOnly must skip the combined report but still emit per-framework output.
          Remove-Item .\reports -Recurse -Force -ErrorAction SilentlyContinue
          & .\Windows-Security-Audit.ps1 -Modules Core -SplitOnly 2>&1 | Out-Null
          $hostDir = Join-Path 'reports' $env:COMPUTERNAME
          $combined = Get-ChildItem $hostDir -Filter 'Windows-Security-Audit-*.html' -ErrorAction SilentlyContinue
          $split = Get-ChildItem (Join-Path $hostDir 'by-framework') -Filter '*-Report-*.html' -ErrorAction SilentlyContinue
          if ($combined) { throw '-SplitOnly produced a combined HTML report; it should be skipped' }
          if (-not $split) { throw '-SplitOnly produced no per-framework reports' }
          Write-Host "  [OK]   -SplitOnly: combined skipped, $($split.Count) split report(s) emitted"

      - name: Rollback script generation (-RollbackPath, no changes applied)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\shared_components\canonical-remediations.ps1
          . .\shared_components\remediation-library.ps1
          . .\shared_components\rollback-generator.ps1

          # Capture real pre-change state and generate the rollback script
          # WITHOUT applying anything: this asserts the capture-before-apply
          # machinery works on a live host, which is the guarantee the
          # remediation flow depends on.
          $plan = New-RemediationPlan -Topics @('GuestAccount','LsaProtection')
          $records = Invoke-PlanCapture -Plan $plan
          if (-not $records) { throw 'no capture records produced' }
          Write-Host "  [OK]   captured $($records.Count) pre-change record(s)"

          $out = Join-Path $env:RUNNER_TEMP 'rollback-verify.ps1'
          New-RollbackScript -CaptureRecords $records -OutputPath $out | Out-Null
          if (-not (Test-Path $out)) { throw 'rollback script was not written' }

          # The generated script must itself be valid PowerShell.
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($out, [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::generated rollback script: $($_.Message)" }
            throw 'generated rollback script does not parse'
          }
          $body = Get-Content $out -Raw
          if ($body -notmatch 'ROLLBACK') { throw 'generated rollback script lacks its typed confirmation gate' }
          Write-Host "  [OK]   rollback script parses cleanly and retains its confirmation gate"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-surface-reports
          path: reports/**/*
          if-no-files-found: warn
          retention-days: 14
