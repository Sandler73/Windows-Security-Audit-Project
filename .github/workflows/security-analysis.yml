# ============================================================================
# CodeQL Analysis
# ----------------------------------------------------------------------------
# Static security analysis of the repository.
#
# NOTE ON LANGUAGE SUPPORT: CodeQL has no PowerShell extractor, so it cannot
# analyse the framework's .ps1 sources directly. Running CodeQL alone would
# therefore give a false sense of coverage for this repository. This workflow
# is deliberately paired with a PowerShell-specific security pass built on
# PSScriptAnalyzer's injection, credential and code-safety rules, which is
# where the real risk for this codebase lives.
#
# CodeQL still runs against the Python tooling under tools/, which is executed
# by CI and is therefore in scope for supply-chain and injection review.
# ============================================================================

name: Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, so newly published queries reach the repository without waiting
    # for the next commit.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:

  powershell-security:
    name: PowerShell security analysis
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer
          Write-Host "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"

      - name: Security-focused rule pass
        shell: pwsh
        run: |
          # Rules chosen for what actually threatens this codebase: it reads
          # system state, builds remediation commands, and writes HTML reports.
          $securityRules = @(
            'PSAvoidUsingInvokeExpression'         # command injection
            'PSAvoidUsingPlainTextForPassword'     # credential exposure
            'PSAvoidUsingConvertToSecureStringWithPlainText'
            'PSUsePSCredentialType'
            'PSAvoidUsingUsernameAndPasswordParams'
            'PSAvoidUsingComputerNameHardcoded'
            'PSAvoidUsingWMICmdlet'                # prefer CIM
            'PSAvoidUsingEmptyCatchBlock'          # silent failure hides findings
            'PSUseDeclaredVarsMoreThanAssignments'
            'PSAvoidGlobalVars'
          )

          $targets = @(
            '.\Windows-Security-Audit.ps1'
            '.\shared_components'
            '.\modules'
          )

          $all = @()
          foreach ($t in $targets) {
            $all += Invoke-ScriptAnalyzer -Path $t -Recurse -IncludeRule $securityRules -Severity Error,Warning
          }

          if ($all) {
            Write-Host "::group::Security findings"
            $all | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 400 | Write-Host
            Write-Host "::endgroup::"
          }

          $errors = @($all | Where-Object Severity -eq 'Error')
          Write-Host ""
          Write-Host "Security rule findings: $($all.Count) ($($errors.Count) error-severity)"

          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "::error file=$($e.ScriptPath),line=$($e.Line)::$($e.RuleName): $($e.Message)"
            }
            throw "PowerShell security analysis found $($errors.Count) error-severity finding(s)"
          }

      - name: Remediation-safety invariants
        shell: pwsh
        run: |
          # These are project-specific invariants that no generic linter knows
          # about, but that matter because the remediation path can change
          # system state on an audited host.
          $orch = Get-Content .\Windows-Security-Audit.ps1 -Raw
          $fail = 0

          function Assert-Invariant {
            param([string]$Name, [bool]$Condition, [string]$Why)
            if ($Condition) { Write-Host "  [OK]   $Name" }
            else { Write-Host "::error::INVARIANT VIOLATED: $Name -- $Why"; $script:fail++ }
          }

          Write-Host "Remediation-safety invariants:"

          Assert-Invariant 'state capture precedes apply' `
            ($orch.IndexOf('Invoke-RollbackCapture') -gt 0 -and
             $orch.IndexOf('Invoke-RollbackCapture') -lt $orch.IndexOf('$null = & $remedScript')) `
            'rollback state must be captured before a remediation is applied'

          Assert-Invariant 'typed confirmation gate retained' `
            ($orch -match "Type 'YES' to confirm") `
            'the interactive confirmation gate must not be removed'

          Assert-Invariant 'tier escalation precedes the YES gate' `
            ($orch.IndexOf('Get-ConfirmationTier') -gt 0 -and
             $orch.IndexOf('Get-ConfirmationTier') -lt $orch.IndexOf("Type 'YES' to confirm")) `
            'impact tiers must add to the confirmation gate, never bypass it'

          Assert-Invariant 'critical tier requires explicit risk acceptance' `
            ($orch -match "-cne 'I ACCEPT THE RISK'") `
            'tier 3 must require a case-sensitive typed acceptance'

          Assert-Invariant 'post-apply verification present' `
            ($orch -match 'Test-RemediationApplied') `
            'a remediation must be verified by reading the setting back'

          if ($fail -gt 0) { throw "$fail remediation-safety invariant(s) violated" }
          Write-Host ""
          Write-Host "All remediation-safety invariants hold."
