# ============================================================================
# Unit Tests Workflow
# ----------------------------------------------------------------------------
# Runs Pester unit tests (audit-common, module-schema, result-schema) across
# the full matrix of currently-supported Windows versions:
#
#   GitHub-hosted runners:
#     - windows-2025  (Windows Server 2025)
#     - windows-latest (currently Windows Server 2025)
#
#   Self-hosted runners (configured per-installation):
#     - self-hosted-server-2016        (Windows Server 2016)
#     - self-hosted-win11-{21h2..24h2} (Windows 11)
#     - self-hosted-win10-21h2/22h2    (Windows 10)
#     - self-hosted-win10-iotltsc-2021 (Windows 10 IoT LTSC 2021)
#
# Each runner is tested under both PowerShell editions:
#   - Windows PowerShell 5.1 (Desktop) -- shell: powershell
#   - PowerShell 7.x        (Core)     -- shell: pwsh
#
# DESIGN NOTE: GitHub Actions does not allow the matrix context in a step's
# `shell:` directive (the workflow validator rejects it before matrix
# expansion). Instead, this workflow splits each runner-class into TWO
# jobs (one per shell), each with `defaults.run.shell` fixed at the job
# level, where matrix substitution is permitted.
# ============================================================================

name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_self_hosted:
        description: 'Include self-hosted runners (requires registered runners)'
        required: false
        default: false
        type: boolean

# Cancel in-progress runs of this workflow when a new push lands on the
# same branch / PR. Prevents queue pile-up under the GitHub Free plan's
# 20-concurrent-job cap during rapid iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # GitHub-hosted -- PowerShell 7.x (Core)
  # --------------------------------------------------------------------------
  pester-hosted-pwsh:
    name: Pester PS7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-latest]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify environment
        run: |
          Write-Host "Runner OS:     ${{ matrix.os }}"
          Write-Host "PowerShell:    $($PSVersionTable.PSVersion)"
          Write-Host "Edition:       $($PSVersionTable.PSEdition)"
          Write-Host "Pester:        $((Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version)"

      - name: Install / verify Pester 5.x
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version -ge '5.0.0' })) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          Write-Host "Pester loaded: $((Get-Module Pester).Version)"

      - name: Run unit tests (audit-common, module-schema)
        run: |
          Import-Module Pester -MinimumVersion 5.0.0

          # Discover every suite rather than listing them. A hardcoded list
          # silently drops new suites: before this change, 12 of 15 test files
          # were never executed by CI.
          $suites = Get-ChildItem -Path '.\tests' -Filter '*.Tests.ps1' |
                    Sort-Object Name | ForEach-Object { $_.FullName }
          if (-not $suites) { throw 'No Pester suites discovered under .\tests' }
          Write-Host "Discovered $($suites.Count) test suite(s):"
          $suites | ForEach-Object { Write-Host "  - $(Split-Path $_ -Leaf)" }

          $config = New-PesterConfiguration
          $config.Run.Path = $suites
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results-${{ matrix.os }}-ps7.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true

          $result = Invoke-Pester -Configuration $config

          Write-Host ""
          Write-Host "====== Summary ======"
          Write-Host "Total:    $($result.TotalCount)"
          Write-Host "Passed:   $($result.PassedCount)"
          Write-Host "Failed:   $($result.FailedCount)"
          Write-Host "Skipped:  $($result.SkippedCount)"

          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ matrix.os }}-ps7
          path: test-results-${{ matrix.os }}-ps7.xml
          retention-days: 30

  # --------------------------------------------------------------------------
  # GitHub-hosted -- Windows PowerShell 5.1 (Desktop)
  # --------------------------------------------------------------------------
  pester-hosted-windowspowershell:
    name: Pester WPS5.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-latest]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify environment
        run: |
          Write-Host "Runner OS:     ${{ matrix.os }}"
          Write-Host "PowerShell:    $($PSVersionTable.PSVersion)"
          Write-Host "Edition:       $($PSVersionTable.PSEdition)"

      - name: Install / verify Pester 5.x
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version -ge '5.0.0' })) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          Write-Host "Pester loaded: $((Get-Module Pester).Version)"

      - name: Run unit tests (audit-common, module-schema)
        run: |
          Import-Module Pester -MinimumVersion 5.0.0

          # Discover every suite rather than listing them. A hardcoded list
          # silently drops new suites: before this change, 12 of 15 test files
          # were never executed by CI.
          $suites = Get-ChildItem -Path '.\tests' -Filter '*.Tests.ps1' |
                    Sort-Object Name | ForEach-Object { $_.FullName }
          if (-not $suites) { throw 'No Pester suites discovered under .\tests' }
          Write-Host "Discovered $($suites.Count) test suite(s):"
          $suites | ForEach-Object { Write-Host "  - $(Split-Path $_ -Leaf)" }

          $config = New-PesterConfiguration
          $config.Run.Path = $suites
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results-${{ matrix.os }}-ps51.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true

          $result = Invoke-Pester -Configuration $config

          Write-Host ""
          Write-Host "====== Summary ======"
          Write-Host "Total:    $($result.TotalCount)"
          Write-Host "Passed:   $($result.PassedCount)"
          Write-Host "Failed:   $($result.FailedCount)"
          Write-Host "Skipped:  $($result.SkippedCount)"

          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ matrix.os }}-ps51
          path: test-results-${{ matrix.os }}-ps51.xml
          retention-days: 30

  # --------------------------------------------------------------------------
  # Self-hosted -- PowerShell 7.x (Core)
  # --------------------------------------------------------------------------
  # Self-hosted -- PowerShell 7.x (Core)
  # --------------------------------------------------------------------------
  # Requires self-hosted runner configuration with matching labels.
  # GATING: Only runs when explicitly requested via workflow_dispatch input
  # OR on the weekly schedule. Without a gate, these matrix jobs queue
  # forever waiting for runners that may not exist on a given installation,
  # tying up the GitHub Free plan's 20-concurrent-job cap and starving
  # the hosted jobs in other workflows.
  # --------------------------------------------------------------------------
  pester-self-hosted-pwsh:
    name: Pester PS7 (${{ matrix.runner.os }})
    # Requires a registered self-hosted runner AND the repository variable
    # ENABLE_SELF_HOSTED set to 'true'; otherwise the job would queue.
    if: vars.ENABLE_SELF_HOSTED == 'true' && github.event_name == 'workflow_dispatch' && inputs.include_self_hosted == true
    runs-on:
      - self-hosted
      - ${{ matrix.runner.label }}
    timeout-minutes: 45
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        runner:
          - { label: server-2016,        os: 'Windows Server 2016' }
          - { label: win11-21h2,         os: 'Windows 11 21H2' }
          - { label: win11-22h2,         os: 'Windows 11 22H2' }
          - { label: win11-23h2,         os: 'Windows 11 23H2' }
          - { label: win11-24h2,         os: 'Windows 11 24H2' }
          - { label: win10-21h2,         os: 'Windows 10 21H2' }
          - { label: win10-22h2,         os: 'Windows 10 22H2' }
          - { label: win10-iotltsc-2021, os: 'Windows 10 IoT LTSC 2021' }

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner identity
        run: |
          Write-Host "Expected: ${{ matrix.runner.os }}"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Actual:   $($os.Caption) (build $($os.BuildNumber))"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"

      - name: Run unit tests
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -ErrorAction SilentlyContinue
          if (-not (Get-Module Pester)) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
            Import-Module Pester -MinimumVersion 5.0.0
          }

          # Discover every suite rather than listing them. A hardcoded list
          # silently drops new suites: before this change, 12 of 15 test files
          # were never executed by CI.
          $suites = Get-ChildItem -Path '.\tests' -Filter '*.Tests.ps1' |
                    Sort-Object Name | ForEach-Object { $_.FullName }
          if (-not $suites) { throw 'No Pester suites discovered under .\tests' }
          Write-Host "Discovered $($suites.Count) test suite(s):"
          $suites | ForEach-Object { Write-Host "  - $(Split-Path $_ -Leaf)" }

          $config = New-PesterConfiguration
          $config.Run.Path = $suites
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results-${{ matrix.runner.label }}-ps7.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload self-hosted test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ matrix.runner.label }}-ps7
          path: test-results-${{ matrix.runner.label }}-ps7.xml
          retention-days: 30

  # --------------------------------------------------------------------------
  # Self-hosted -- Windows PowerShell 5.1 (Desktop)
  # --------------------------------------------------------------------------
  pester-self-hosted-windowspowershell:
    name: Pester WPS5.1 (${{ matrix.runner.os }})
    # Requires a registered self-hosted runner AND the repository variable
    # ENABLE_SELF_HOSTED set to 'true'; otherwise the job would queue.
    if: vars.ENABLE_SELF_HOSTED == 'true' && github.event_name == 'workflow_dispatch' && inputs.include_self_hosted == true
    runs-on:
      - self-hosted
      - ${{ matrix.runner.label }}
    timeout-minutes: 45
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        runner:
          - { label: server-2016,        os: 'Windows Server 2016' }
          - { label: win11-21h2,         os: 'Windows 11 21H2' }
          - { label: win11-22h2,         os: 'Windows 11 22H2' }
          - { label: win11-23h2,         os: 'Windows 11 23H2' }
          - { label: win11-24h2,         os: 'Windows 11 24H2' }
          - { label: win10-21h2,         os: 'Windows 10 21H2' }
          - { label: win10-22h2,         os: 'Windows 10 22H2' }
          - { label: win10-iotltsc-2021, os: 'Windows 10 IoT LTSC 2021' }

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify runner identity
        run: |
          Write-Host "Expected: ${{ matrix.runner.os }}"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Actual:   $($os.Caption) (build $($os.BuildNumber))"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"

      - name: Run unit tests
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -ErrorAction SilentlyContinue
          if (-not (Get-Module Pester)) {
            Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
            Import-Module Pester -MinimumVersion 5.0.0
          }

          $config = New-PesterConfiguration
          $suites = Get-ChildItem -Path '.\tests' -Filter '*.Tests.ps1' | Sort-Object Name | ForEach-Object { $_.FullName }
          if (-not $suites) { throw 'No Pester suites discovered under .\tests' }
          $config.Run.Path = $suites
          $config.Run.PassThru = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results-${{ matrix.runner.label }}-ps51.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload self-hosted test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-${{ matrix.runner.label }}-ps51
          path: test-results-${{ matrix.runner.label }}-ps51.xml
          retention-days: 30

  # --------------------------------------------------------------------------
  # Aggregate test summary
  # --------------------------------------------------------------------------
  # Publishes Pester test result XML files (collected from artifacts) as a
  # GitHub Check Run via dorny/test-reporter. Required permissions for v3:
  #   contents: read   (read repo for git ls-files context)
  #   actions: read    (download artifacts from prior jobs in this run)
  #   checks: write    (create the test-result check run)
  #
  # NOTE: dorny/test-reporter requires the repo to be checked out; otherwise
  # its internal `git ls-files` fails with "fatal: not a git repository".
  # --------------------------------------------------------------------------
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [pester-hosted-pwsh, pester-hosted-windowspowershell]
    if: always()
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          path: test-results

      # Pester writes NUnit-schema XML. The reporter must be told that;
      # pointing a JUnit parser at an NUnit document made this job fail with
      # "TypeError: Cannot read properties of undefined (reading '$')" even
      # though every test had passed.
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Pester Test Results
          path: 'test-results/**/*.xml'
          reporter: dotnet-nunit
          fail-on-error: false

      # Summary computed directly from the result files. This does not depend
      # on the third-party reporter, so a parser incompatibility can no longer
      # hide the outcome, and it is what decides whether this job passes.
      - name: Summarise results
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path test-results -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue)
          if (-not $files) {
            Write-Host "::error::No test result files were found under test-results/"
            exit 1
          }

          $total = 0; $failed = 0; $skipped = 0; $rows = @()
          foreach ($f in $files) {
            try { [xml]$doc = Get-Content $f.FullName -Raw }
            catch { Write-Host "::warning::Could not parse $($f.Name): $($_.Exception.Message)"; continue }

            # Pester's NUnit output carries totals on the root <test-results>
            # element; JUnit uses <testsuite(s)>. Read whichever is present so
            # this keeps working if the output format is ever changed.
            $r = $doc.DocumentElement
            if ($r.LocalName -eq 'test-results') {
              $t = [int]$r.total; $e = [int]$r.errors; $fl = [int]$r.failures
              $sk = [int]$r.'not-run'
              $fail = $e + $fl
            }
            elseif ($r.LocalName -in @('testsuites','testsuite')) {
              $t = [int]$r.tests; $fail = [int]$r.failures + [int]$r.errors; $sk = [int]$r.skipped
            }
            else {
              Write-Host "::warning::Unrecognised result schema in $($f.Name): <$($r.LocalName)>"
              continue
            }

            $total += $t; $failed += $fail; $skipped += $sk
            $rows += [PSCustomObject]@{ File = $f.Directory.Name; Tests = $t; Failed = $fail; Skipped = $sk }
          }

          $rows | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          $passed = $total - $failed - $skipped
          "## Pester Test Summary"                             | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          ""                                                    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Result | Count |"                                  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "|--------|------:|"                                  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Passed | $passed |"                                | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Failed | $failed |"                                | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Skipped | $skipped |"                              | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| **Total** | **$total** |"                          | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          Write-Host ""
          Write-Host "Across $($files.Count) result file(s): $passed passed, $failed failed, $skipped skipped, $total total."

          if ($failed -gt 0) {
            Write-Host "::error::$failed test(s) failed"
            exit 1
          }
          Write-Host "All tests passed."
